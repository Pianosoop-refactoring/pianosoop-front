services:
  db:
    image: postgres:16-alpine
    container_name: pianosoop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pianosoop
    volumes:
      - pianosoop_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pianosoop"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../Pianosoop-backend-spring
      dockerfile: Dockerfile
    container_name: pianosoop-backend
    restart: unless-stopped
    env_file:
      - ../Pianosoop-backend-spring/.env
    environment:
      APP_PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: pianosoop
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pianosoop-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pianosoop_postgres_data:
